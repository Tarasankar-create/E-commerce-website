kind: Deployment
apiVersion: apps/v1
metadata:
  name: django-app
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django_app
  template:
    metadata:
      labels:
        app: django_app
    spec:
      containers:
      - name: django-dep
        image: tarasankar393/django-app:v2.0.5
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: django-config
        - secretRef:
            name: django-secret
        volumeMounts:
        - name: media-storage
          mountPath: /app/media
      volumes:
      - name: media-storage
        persistentVolumeClaim:
          claimName: django-media-pvc