kind: Application
apiVersion: argoproj.io/v1alpha1
metadata:
  name: webmart
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Tarasankar-create/webmart-web.git"
    targetRevision: prod
    path: k8s
  destination:
    server: "https://kubernetes.default.svc"
    namespace: ecommerce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true